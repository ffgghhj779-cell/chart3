<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gold Nightmare – XAUUSD Live</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

    <div class="top-red-bar"></div>

    <!-- Loading Overlay -->
    <div id="loading-screen">
        <div class="loading-inner">
            <svg viewBox="0 0 200 200" width="80" height="80" opacity="0.9">
                <polygon points="100,10 180,50 180,150 100,190 20,150 20,50" fill="none" stroke="#ffaa00" stroke-width="8"/>
                <path d="M 50 85 L 65 50 L 100 75 L 135 50 L 150 85 Z" fill="#ffaa00" />
                <text x="100" y="155" font-family="Arial" font-size="60" font-weight="900" fill="#ffaa00" text-anchor="middle">GN</text>
            </svg>
            <div class="loading-text">جاري تحميل البيانات الحية<span class="dots">...</span></div>
            <div class="loading-sub">XAUUSD · H1 · Live</div>
        </div>
    </div>

    <!-- Watermark -->
    <div class="watermark-container">
        <svg viewBox="0 0 200 200" width="400" height="400" opacity="0.04">
            <polygon points="100,10 180,50 180,150 100,190 20,150 20,50" fill="none" stroke="#ffaa00" stroke-width="8"/>
            <path d="M 50 85 L 65 50 L 100 75 L 135 50 L 150 85 Z" fill="#ffaa00" />
            <text x="100" y="150" font-family="Arial" font-size="70" font-weight="900" fill="#ffaa00" text-anchor="middle" letter-spacing="4">GN</text>
        </svg>
    </div>

    <!-- Chart Container -->
    <div id="tvchart"></div>

    <!-- HTML Overlay Lines (positioned by JS) -->
    <div class="custom-lines-container" id="custom-lines">
        <div id="entry-zone" class="zone gold-zone"></div>
        <div class="chart-line red-line" id="line-sl">
            <div class="line-path"></div>
            <div class="line-label red-label" id="label-sl">SL –</div>
        </div>
        <div class="chart-line gold-line dashed" id="line-vwap">
            <div class="line-path"></div>
            <div class="line-label gold-label" id="label-vwap">VWAP-D –</div>
        </div>
        <div class="chart-line gold-line" id="line-entry-high">
            <div class="line-path"></div>
        </div>
        <div class="chart-line gold-line" id="line-entry-low">
            <div class="line-path"></div>
            <div class="line-label gold-label" id="label-entry">ENTRY –</div>
        </div>
        <div class="chart-line green-line" id="line-tp1">
            <div class="line-path"></div>
            <div class="line-label green-label" id="label-tp1">TP1 –</div>
        </div>
        <div class="chart-line green-line dashed" id="line-tp2">
            <div class="line-path"></div>
            <div class="line-label green-label" id="label-tp2">TP2 –</div>
        </div>
        <div class="chart-line green-line dashed" id="line-tp3">
            <div class="line-path"></div>
            <div class="line-label green-label" id="label-tp3">TP3 –</div>
        </div>
    </div>

    <!-- Live Price Ticker (top bar) -->
    <div id="live-price-bar">
        <span id="live-price-val">–</span>
        <span id="live-price-change" class="price-change">–</span>
    </div>

    <!-- Top Left -->
    <div class="overlay top-left">
        <div class="ticker">XAUUSD <span class="timeframe">H1</span></div>
        <div class="strategy-name" style="direction: rtl;">كابوس الذهب</div>
        <div class="date-info" id="live-date">–</div>
    </div>

    <!-- Top Center -->
    <div class="overlay top-center">
        <div class="sell-badge" id="signal-badge">SELL</div>
        <div class="setup-info" style="direction: rtl;" id="signal-sub">بيع · إعداد C · ثقة 48%</div>
    </div>

    <!-- Top Right -->
    <div class="overlay top-right">
        <div class="c-badge">C</div>
    </div>

    <!-- Bottom Left Dashboard -->
    <div class="overlay bottom-left">
        <div class="plan-title" style="direction: rtl;">خطة الصفقة <span class="fvg-text">FVG</span></div>
        <table class="plan-table">
            <tr><td class="col-label">ENTRY</td><td class="col-value" id="d-entry">–</td></tr>
            <tr><td class="col-label">STOP</td><td class="col-value" id="d-stop">–</td></tr>
            <tr><td class="col-label">TP1</td><td class="col-value" id="d-tp1">–</td></tr>
            <tr><td class="col-label">TP2</td><td class="col-value" id="d-tp2">–</td></tr>
            <tr><td class="col-label">TP3</td><td class="col-value" id="d-tp3">–</td></tr>
            <tr>
                <td class="col-label">CONV</td>
                <td class="col-value">
                    <div class="progress-bar-container"><div class="progress-bar" style="width:48%;"></div></div>
                    48%
                </td>
            </tr>
        </table>
    </div>

    <div class="overlay bottom-right">Gold Nightmare Intelligence Lab</div>

    <script src="script.js"></script>
</body>
</html>
